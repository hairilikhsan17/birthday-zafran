<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Admin Panel — Zafran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF8EC;--cream-deep:#FFE8B7;--honey:#F2A93B;--honey-dark:#C97D1E;
  --brown-deep:#3E2818;--brown:#6B4423;--leaf:#7CB342;--leaf-dark:#4a7c20;
  --coral:#FF7043;--white:#FFFDF7;
  --shadow:0 8px 28px rgba(62,40,24,0.13);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Nunito',sans-serif;
  background:var(--cream);
  color:var(--brown-deep);
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Fredoka',sans-serif;font-weight:600;}

/* ── LOGIN SCREEN ── */
.login-screen{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:linear-gradient(135deg,var(--cream) 0%,#fff9f0 100%);
}
.login-box{
  background:var(--white);
  border-radius:28px;
  padding:40px 36px;
  width:100%;max-width:380px;
  box-shadow:0 16px 48px rgba(62,40,24,0.14);
  text-align:center;
}
.login-box .ant-icon{font-size:3rem;margin-bottom:8px;display:block;animation:bob 2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.login-box h1{font-size:1.7rem;color:var(--brown-deep);margin-bottom:6px;}
.login-box p{font-size:0.88rem;color:var(--brown);opacity:0.7;margin-bottom:28px;}
.login-input{
  width:100%;
  font-family:'Nunito',sans-serif;
  border:2px solid var(--cream-deep);
  background:var(--cream);
  border-radius:14px;
  padding:13px 16px;
  font-size:1rem;
  color:var(--brown-deep);
  transition:border-color 0.2s,box-shadow 0.2s;
  margin-bottom:14px;
  text-align:center;
  letter-spacing:2px;
}
.login-input:focus{outline:none;border-color:var(--honey);box-shadow:0 0 0 4px rgba(242,169,59,0.12);}
.login-btn{
  width:100%;
  font-family:'Fredoka',sans-serif;
  background:linear-gradient(135deg,var(--brown-deep),var(--brown));
  color:#fff;border:none;
  border-radius:14px;padding:14px;
  font-size:1.1rem;cursor:pointer;
  transition:transform 0.15s,box-shadow 0.15s;
  box-shadow:0 6px 18px rgba(62,40,24,0.22);
}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(62,40,24,0.28);}
.login-err{
  font-size:0.85rem;font-weight:700;
  color:var(--coral);margin-top:10px;
  min-height:20px;
}

/* ── ADMIN DASHBOARD ── */
.admin-app{display:none;}
.admin-app.show{display:block;}

.admin-header{
  background:linear-gradient(135deg,var(--brown-deep),#5a3520);
  color:var(--cream);
  padding:18px 28px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 4px 18px rgba(62,40,24,0.25);
}
.admin-header h1{font-size:1.3rem;color:var(--honey);display:flex;align-items:center;gap:8px;}
.admin-header-right{display:flex;align-items:center;gap:10px;}
.admin-badge{
  background:rgba(255,255,255,0.12);
  border-radius:999px;
  padding:5px 14px;
  font-size:0.8rem;
  color:var(--cream-deep);
  font-weight:700;
}
.logout-btn{
  background:rgba(255,112,67,0.2);
  border:1.5px solid rgba(255,112,67,0.4);
  color:#FF7043;
  border-radius:999px;
  padding:6px 16px;
  font-size:0.82rem;
  cursor:pointer;
  font-family:'Fredoka',sans-serif;
  transition:background 0.2s;
}
.logout-btn:hover{background:rgba(255,112,67,0.35);}

.admin-main{
  max-width:860px;
  margin:0 auto;
  padding:32px 20px 80px;
  display:flex;
  flex-direction:column;
  gap:28px;
}

/* Tabs */
.admin-tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.tab-btn{
  font-family:'Fredoka',sans-serif;
  font-size:0.95rem;
  padding:9px 22px;
  border-radius:999px;
  border:2px solid var(--cream-deep);
  background:var(--white);
  color:var(--brown);
  cursor:pointer;
  transition:background 0.2s,border-color 0.2s,color 0.2s;
  display:flex;align-items:center;gap:6px;
}
.tab-btn.active{
  background:var(--brown-deep);
  border-color:var(--brown-deep);
  color:var(--honey);
}
.tab-btn:hover:not(.active){background:var(--cream-deep);}

/* Panel */
.admin-panel{display:none;}
.admin-panel.active{display:block;}

/* Stats row */
.stats-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
  margin-bottom:24px;
}
.stat-card{
  background:var(--white);
  border-radius:20px;
  padding:20px 16px;
  text-align:center;
  box-shadow:var(--shadow);
}
.stat-num{
  font-family:'Fredoka',sans-serif;
  font-size:2.2rem;
  color:var(--honey-dark);
  line-height:1;
}
.stat-label{font-size:0.78rem;color:var(--brown);opacity:0.65;margin-top:4px;font-weight:700;}

/* Section title */
.panel-section-title{
  font-size:1.05rem;
  color:var(--brown-deep);
  margin-bottom:14px;
  display:flex;align-items:center;gap:7px;
}

/* Message cards */
.admin-msg-list{display:flex;flex-direction:column;gap:10px;}
.admin-msg-item{
  background:var(--white);
  border-radius:16px;
  padding:14px 16px;
  display:flex;gap:12px;align-items:flex-start;
  box-shadow:0 3px 12px rgba(62,40,24,0.07);
  border-left:4px solid var(--leaf);
  transition:box-shadow 0.2s;
}
.admin-msg-item:hover{box-shadow:0 6px 20px rgba(62,40,24,0.11);}
.msg-avatar{
  width:36px;height:36px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--honey),var(--coral));
  display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka',sans-serif;
  font-size:1rem;color:#fff;font-weight:600;flex-shrink:0;
}
.msg-body{flex:1;min-width:0;}
.msg-name{font-family:'Fredoka',sans-serif;color:var(--honey-dark);font-size:1rem;}
.msg-text{font-size:0.9rem;color:var(--brown-deep);margin-top:4px;line-height:1.5;word-break:break-word;}
.msg-time{font-size:0.73rem;color:var(--brown);opacity:0.55;margin-top:4px;}
.del-btn{
  flex-shrink:0;
  width:32px;height:32px;border-radius:50%;
  border:none;background:#ffebe6;color:var(--coral);
  font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.15s,transform 0.15s;
}
.del-btn:hover{background:#ffd5cc;transform:scale(1.1);}

/* Gallery cards */
.admin-gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px;
}
.admin-gallery-card{
  background:var(--white);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform 0.2s,box-shadow 0.2s;
}
.admin-gallery-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(62,40,24,0.15);}
.admin-gallery-card img{
  width:100%;height:130px;
  object-fit:cover;display:block;
}
.admin-gallery-card-body{
  padding:10px 12px;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
}
.admin-gallery-card-name{
  font-family:'Fredoka',sans-serif;
  font-size:0.88rem;color:var(--honey-dark);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;
}
.admin-gallery-card-time{
  font-size:0.7rem;color:var(--brown);opacity:0.5;
  white-space:nowrap;
}

/* Empty state */
.admin-empty{
  text-align:center;padding:40px 0;
  color:var(--brown);opacity:0.55;font-weight:700;
  display:flex;flex-direction:column;gap:8px;align-items:center;
}
.admin-empty-icon{font-size:2.8rem;}

/* Back link */
.back-link{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'Fredoka',sans-serif;
  font-size:0.9rem;
  color:var(--honey-dark);
  text-decoration:none;
  padding:7px 16px;
  border-radius:999px;
  background:var(--cream-deep);
  transition:background 0.2s;
}
.back-link:hover{background:var(--honey);color:#fff;}

/* Confirm delete toast */
.admin-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--brown-deep);color:var(--cream);
  font-family:'Fredoka',sans-serif;font-size:1rem;
  padding:12px 28px;border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
  opacity:0;transition:opacity 0.3s;
  z-index:9999;pointer-events:none;
}
.admin-toast.show{opacity:1;}

@media(max-width:500px){
  .admin-header{padding:14px 16px;}
  .admin-main{padding:20px 12px 60px;}
  .admin-gallery-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <span class="ant-icon">🐜</span>
    <h1>Panel Admin</h1>
    <p>Masukkan password untuk mengakses manajemen data undangan Zafran</p>
    <input type="password" class="login-input" id="admin-pw"
      placeholder="••••••••••" maxlength="30" autocomplete="off"
      autofocus>
    <button class="login-btn" id="admin-login-btn">Masuk 🔐</button>
    <p class="login-err" id="login-err"></p>
  </div>
</div>

<!-- ── ADMIN DASHBOARD ── -->
<div class="admin-app" id="admin-app">

  <header class="admin-header">
    <h1>🐜 Admin Panel · Zafran</h1>
    <div class="admin-header-right">
      <a href="index.html" class="back-link">← Kembali ke Undangan</a>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
  </header>

  <main class="admin-main">

    <!-- Stats -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-wishes">—</div>
        <div class="stat-label">💛 Ucapan Masuk</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-photos">—</div>
        <div class="stat-label">📷 Foto Diupload</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="wishes">💛 Ucapan</button>
      <button class="tab-btn" data-tab="photos">📷 Foto Upload</button>
    </div>

    <!-- Panel Ucapan -->
    <div class="admin-panel active" id="panel-wishes">
      <h3 class="panel-section-title">💛 Daftar Ucapan</h3>
      <div class="admin-msg-list" id="wishes-list"></div>
    </div>

    <!-- Panel Foto -->
    <div class="admin-panel" id="panel-photos">
      <h3 class="panel-section-title">📷 Foto Bareng Zafran</h3>
      <div class="admin-gallery-grid" id="gallery-grid"></div>
    </div>

  </main>
</div>

<!-- Toast -->
<div class="admin-toast" id="admin-toast"></div>

<script>
var ADMIN_PW     = 'admin12345';
var WISHES_KEY   = 'zafran_wishes_v1';
var GALLERY_KEY  = 'zafran_gallery_v1';
var loginScreen  = document.getElementById('login-screen');
var adminApp     = document.getElementById('admin-app');
var pwInput      = document.getElementById('admin-pw');
var loginBtn     = document.getElementById('admin-login-btn');
var loginErr     = document.getElementById('login-err');
var logoutBtn    = document.getElementById('logout-btn');
var toast        = document.getElementById('admin-toast');

/* ── helpers ── */
function escHtml(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function timeAgo(ts){
  var diff=Date.now()-ts, m=Math.floor(diff/60000);
  if(m<1) return 'baru saja';
  if(m<60) return m+' menit lalu';
  var h=Math.floor(m/60);
  if(h<24) return h+' jam lalu';
  return Math.floor(h/24)+' hari lalu';
}
function fmtDate(ts){
  var d=new Date(ts);
  return d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})+
    ' · '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  setTimeout(function(){ toast.classList.remove('show'); },2200);
}

/* ── Load/Save ── */
function loadWishes(){ try{var r=localStorage.getItem(WISHES_KEY);return r?JSON.parse(r):[];}catch(e){return[];} }
function saveWishes(l){ localStorage.setItem(WISHES_KEY,JSON.stringify(l)); }
function loadGallery(){ try{var r=localStorage.getItem(GALLERY_KEY);return r?JSON.parse(r):[];}catch(e){return[];} }
function saveGallery(l){ localStorage.setItem(GALLERY_KEY,JSON.stringify(l)); }

/* ── Update Stats ── */
function updateStats(){
  document.getElementById('stat-wishes').textContent  = loadWishes().length;
  document.getElementById('stat-photos').textContent  = loadGallery().length;
}

/* ── Render Wishes ── */
function renderWishes(){
  var list = document.getElementById('wishes-list');
  var items = loadWishes().slice().sort(function(a,b){return b.timestamp-a.timestamp;});
  list.innerHTML='';
  if(items.length===0){
    list.innerHTML='<div class="admin-empty"><span class="admin-empty-icon">💛</span>Belum ada ucapan masuk.</div>';
    return;
  }
  items.forEach(function(w){
    var div=document.createElement('div');
    div.className='admin-msg-item';
    div.innerHTML=
      '<div class="msg-avatar">'+escHtml(w.name.charAt(0).toUpperCase())+'</div>'+
      '<div class="msg-body">'+
        '<div class="msg-name">'+escHtml(w.name)+'</div>'+
        '<div class="msg-text">'+escHtml(w.message)+'</div>'+
        '<div class="msg-time">'+fmtDate(w.timestamp)+' · '+timeAgo(w.timestamp)+'</div>'+
      '</div>'+
      '<button class="del-btn" data-ts="'+w.timestamp+'" title="Hapus">🗑</button>';
    list.appendChild(div);
  });
  list.querySelectorAll('.del-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var ts=parseInt(btn.getAttribute('data-ts'));
      saveWishes(loadWishes().filter(function(x){return x.timestamp!==ts;}));
      showToast('✅ Ucapan dihapus');
      renderWishes(); updateStats();
    });
  });
}

/* ── Render Gallery ── */
function renderGallery(){
  var grid = document.getElementById('gallery-grid');
  var items = loadGallery().slice().sort(function(a,b){return b.timestamp-a.timestamp;});
  grid.innerHTML='';
  if(items.length===0){
    grid.innerHTML='<div class="admin-empty" style="grid-column:1/-1"><span class="admin-empty-icon">📷</span>Belum ada foto diupload.</div>';
    return;
  }
  items.forEach(function(item){
    var card=document.createElement('div');
    card.className='admin-gallery-card';
    card.innerHTML=
      '<img src="'+item.dataUrl+'" alt="'+escHtml(item.name)+'" loading="lazy">'+
      '<div class="admin-gallery-card-body">'+
        '<div>'+
          '<div class="admin-gallery-card-name">'+escHtml(item.name)+'</div>'+
          '<div class="admin-gallery-card-time">'+timeAgo(item.timestamp)+'</div>'+
        '</div>'+
        '<button class="del-btn" data-id="'+item.id+'" title="Hapus foto">🗑</button>'+
      '</div>';
    grid.appendChild(card);
  });
  grid.querySelectorAll('.del-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var id=parseInt(btn.getAttribute('data-id'));
      saveGallery(loadGallery().filter(function(x){return x.id!==id;}));
      showToast('✅ Foto dihapus');
      renderGallery(); updateStats();
    });
  });
}

/* ── Tabs ── */
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.admin-panel').forEach(function(p){p.classList.remove('active');});
    btn.classList.add('active');
    document.getElementById('panel-'+btn.getAttribute('data-tab')).classList.add('active');
  });
});

/* ── Login ── */
function doLogin(){
  if(pwInput.value===ADMIN_PW){
    loginScreen.style.display='none';
    adminApp.classList.add('show');
    loginErr.textContent='';
    updateStats(); renderWishes(); renderGallery();
  } else {
    loginErr.textContent='❌ Password salah, coba lagi.';
    pwInput.value='';
    pwInput.focus();
    pwInput.style.borderColor='var(--coral)';
    setTimeout(function(){pwInput.style.borderColor='';},800);
  }
}
loginBtn.addEventListener('click',doLogin);
pwInput.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
logoutBtn.addEventListener('click',function(){
  adminApp.classList.remove('show');
  loginScreen.style.display='';
  pwInput.value='';
  pwInput.focus();
});

/* Auto-login kalau sudah authed dari index.html via sessionStorage */
if(sessionStorage.getItem('zafran_admin_authed')==='1'){
  pwInput.value=ADMIN_PW;
  doLogin();
}
</script>
</body>
</html>
